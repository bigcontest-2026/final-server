name: Check final-server

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      DONGHAENG_PROVIDER: openai_responses
      OPENAI_API_KEY: ''
      DONGHAENG_PHOENIX_ENABLED: 'false'
      ACCESS_MODE: local_development
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend, model, agent and isolated evaluation dependencies
        run: python -m pip install -r requirements-agent-dev.txt
        working-directory: service/backend
      - name: Check required agent and service contracts without external model calls
        run: python service/scripts/check_backend_ci.py
      - name: Verify local bundles and report storage
        if: success() || failure()
        run: python scripts/smoke_test.py --local-only
      - name: Save backend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-agent-test-results
          path: service/.artifacts/backend-ci/
